plugins {
    id 'java-library'
}

group = 'dev.rl.suite'
version = '1.3.1'
description = 'Packet payload extraction and cross-revision packet mapping.'

base {
    archivesName = 'rl-suite-hooks'
}

repositories {
    mavenCentral()
}

dependencies {
    // One-way dependency: this module reads JarArchive, PacketTableReader and
    // TransformException from transform-jar. Nothing in transform-jar refers
    // back to this module.
    api project(':transform-jar')
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(11)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-parameters'
}

// Executable fat JAR for HookCli, mirroring transform-jar's shadedJar. The
// library JAR is still produced alongside it.
tasks.register('shadedJar', Jar) {
    description = 'Builds the executable hook-analysis JAR with dependencies bundled.'
    group = 'build'
    archiveClassifier = 'all'
    // The runtime classpath includes transform-jar's library JAR, which has to
    // be built before this task can expand it.
    dependsOn configurations.runtimeClasspath
    manifest {
        attributes 'Main-Class': 'dev.rl.suite.packet.HookCli'
    }
    from sourceSets.main.output
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    exclude 'META-INF/*.SF'
    exclude 'META-INF/*.DSA'
    exclude 'META-INF/*.RSA'
    exclude 'META-INF/MANIFEST.MF'
    exclude 'module-info.class'
}

tasks.named('assemble') {
    dependsOn tasks.named('shadedJar')
}
