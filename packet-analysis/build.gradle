plugins {
    id 'java-library'
}

group = 'dev.rl.suite'
version = '1.3.1'
description = 'Packet payload extraction and cross-revision packet mapping.'

repositories {
    mavenCentral()
}

dependencies {
    // One-way dependency: this module reads JarArchive, PacketTableReader and
    // TransformException from transform-jar. Nothing in transform-jar refers
    // back to this module.
    api project(':transform-jar')
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(11)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-parameters'
}
